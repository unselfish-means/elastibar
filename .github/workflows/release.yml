# Packages the addon with the BigWigs packager and uploads it to CurseForge.
# Shared across the WIKR addons; see the curseforge-packaging runbook in
# wow-addons-skill before changing it here.
#
# Runs when a tag is pushed (a tag containing "alpha" or "beta" uploads as that
# type; any other tag uploads as a release). Run it by hand with an existing
# tag to retry an upload. The GitHub release is made by the repo's own release
# script, so this workflow gets no GitHub token and never creates one.
name: Package and release

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to package and upload
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The packager reads CF_API_TOKEN; the repository Actions secret is named
      # CURSEFORGE_API_TOKEN.
      CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # the packager needs history and tags for the changelog

      # The packager skips the CurseForge upload without saying so if either is
      # missing, so fail here instead.
      - name: Check CurseForge setup
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "::error::The CURSEFORGE_API_TOKEN repository Actions secret isn't set."
            exit 1
          fi
          if ! git ls-files '*.toc' | xargs grep -lE '^## X-Curse-Project-ID: *[0-9]+' > /dev/null; then
            echo "::error::No .toc has a '## X-Curse-Project-ID:' line."
            exit 1
          fi

      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          # "<file name>:<CurseForge display name>". Both are "<Addon>-<tag>", for
          # example Reclaim-1.0.3. Without the part after ":", the packager's
          # default display name is the tag plus a game-type suffix ("1.0.3-forever").
          args: -n "{package-name}-{project-version}:{package-name}-{project-version}"
